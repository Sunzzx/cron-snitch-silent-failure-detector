[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "cron-snitch-silent-failure-detector"
version = "0.1.0"
description = "Silent Cron Failure & Dead Man's Snitch Watchdog for developers and indie hackers."
readme = "README.md"
authors = [{ name = "Sunzzx" }]
license = { text = "MIT" }
requires-python = ">=3.10"
dependencies = []

[project.scripts]
cron-snitch = "cron_snitch.cli:main"

[tool.setuptools.packages.find]
where = ["src"]
